<style>
:root{
  --paper:#EFE7D8;
  --paper-deep:#E4DAC5;
  --card:#FFFBF2;
  --ink:#2B2622;
  --ink-soft:#5C5347;
  --indigo:#223A5E;
  --indigo-deep:#182B45;
  --hanko:#A83232;
  --hanko-deep:#7E2323;
  --gold:#B08D3E;
  --line:rgba(43,38,34,0.14);
  --shadow:0 2px 10px rgba(43,38,34,0.10);
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(34,58,94,0.05), transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(168,50,50,0.05), transparent 40%);
  color:var(--ink);
  font-family:'Zen Kaku Gothic New', sans-serif;
  min-height:100vh;
  line-height:1.6;
}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 80px;}

/* ---- Header (noren style) ---- */
header.noren{
  background:var(--indigo);
  background-image:linear-gradient(180deg, var(--indigo) 0%, var(--indigo-deep) 100%);
  padding:36px 20px 22px;
  position:relative;
  border-bottom:6px solid var(--hanko);
}
header.noren::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:-6px;
  height:6px;
  background:repeating-linear-gradient(90deg, transparent 0 26px, rgba(239,231,216,0.9) 26px 30px);
}
.noren-inner{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
.title-block h1{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  color:#F5EFE0;
  font-size:clamp(26px,5vw,38px);
  margin:0 0 6px;
  letter-spacing:.03em;
}
.title-block p{
  color:#C7D2E0;
  font-size:13px;
  margin:0;
  letter-spacing:.08em;
}
.member-pill{

/* ---- section heading ---- */
.section-head{display:flex;justify-content:space-between;align-items:center;margin:34px 0 16px;flex-wrap:wrap;gap:10px;}
.section-head h2{
  font-family:'Shippori Mincho', serif;
  font-size:21px;
  font-weight:700;
  margin:0;
  color:var(--ink);

}
.btn{
  font-family:'Zen Kaku Gothic New', sans-serif;
  border:1px solid var(--indigo);
  background:var(--card);
  color:var(--indigo);

  border-radius:8px;
  font-size:14px;
  cursor:pointer;

}
.btn:hover{background:var(--indigo);color:#fff;}
.btn.primary{background:var(--hanko);color:#fff;border-color:var(--hanko);}

.controls-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.control-input{
  font-family:'Zen Kaku Gothic New', sans-serif;

}
.controls-bar input.control-input{flex:1 1 200px;min-width:160px;}
.controls-bar select.control-input{flex:0 1 180px;}

/* ---- shop grid ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.shop-card{
  background:var(--card);
  border:1px solid var(--line);

}
.shop-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px rgba(43,38,34,0.16);}

}
.shop-body{padding:14px 14px 16px;}
.shop-name{
  font-family:'Shippori Mincho', serif;
  font-weight:700;
  font-size:17px;

}
.shop-meta{font-size:12.5px;color:var(--ink-soft);}
.shop-recent-dates{font-size:11.5px;color:var(--gold);margin:4px 0 0;letter-spacing:.02em;}

/* ---- hanko stamp ---- */
.hanko{
  position:absolute;
  top:10px;right:10px;
  width:52px;height:52px;
  border-radius:50%;

}
.hanko .num{font-size:17px;font-weight:600;}
.hanko .lbl{font-size:8px;letter-spacing:.05em;margin-top:1px;}
.hanko.inline{position:static;transform:rotate(-6deg);width:44px;height:44px;flex-shrink:0;}
.hanko.tiny{position:static;transform:rotate(-4deg);width:36px;height:36px;flex-shrink:0;}
.hanko.tiny .num{font-size:13px;}

.hanko.empty{color:var(--ink-soft);border-color:var(--ink-soft);opacity:.6;}

/* ---- empty state ---- */
.empty-state{
  border:1px dashed var(--line);
  border-radius:var(--radius);
  padding:40px 20px;
  text-align:center;
  color:var(--ink-soft);
  background:rgba(255,251,242,0.5);
}
.empty-state p{margin:0 0 14px;}

/* ---- detail view ---- */
.back-link{
  background:none;border:none;color:var(--indigo);font-size:14px;cursor:pointer;
  padding:0;margin-bottom:18px;display:inline-flex;align-items:center;gap:4px;
  font-family:'Zen Kaku Gothic New', sans-serif;
}
.back-link:hover{text-decoration:underline;}
.shop-header{
  display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;

  padding:18px;box-shadow:var(--shadow);position:relative;
}
.shop-header img{width:150px;height:150px;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--paper-deep);}
.shop-header .ph-placeholder{width:150px;height:150px;border-radius:10px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;color:var(--ink-soft);font-size:13px;flex-shrink:0;}
.shop-header h2{font-family:'Shippori Mincho', serif;font-size:24px;margin:0 0 8px;}
.shop-header .stat{font-size:13px;color:var(--ink-soft);margin-bottom:4px;}

/* ---- visit card ---- */
.visit-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow);
}
.visit-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:12px;flex-wrap:wrap;}
.visit-date{font-family:'Shippori Mincho', serif;font-size:17px;font-weight:700;}
.visit-topics{padding:0 16px 12px;color:var(--ink-soft);font-size:13.5px;white-space:pre-wrap;}
.visit-topics-label{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-right:6px;}
.entries{border-top:1px solid var(--line);}
.entry{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.entry:last-child{border-bottom:none;}
.entry-photo{width:70px;height:70px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--paper-deep);}
.entry-body{flex:1;min-width:0;}
.entry-author{font-weight:500;font-size:14px;margin-bottom:2px;}
.entry-comment{font-size:13.5px;color:var(--ink-soft);white-space:pre-wrap;word-break:break-word;}

/* ---- modal ---- */
.overlay{
  position:fixed;inset:0;background:rgba(43,38,34,0.55);

}
.modal{
  background:var(--paper);border-radius:16px;max-width:480px;width:100%;

}
.modal h3{font-family:'Shippori Mincho', serif;margin:0 0 18px;font-size:19px;border-left:4px solid var(--hanko);padding-left:10px;}
.field{margin-bottom:15px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em;}
.field input[type=text], .field input[type=date], .field textarea, .field select{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  font-family:'Zen Kaku Gothic New', sans-serif;font-size:14px;background:#fff;color:var(--ink);
}
.field textarea{resize:vertical;min-height:60px;}
.field input[type=file]{font-size:13px;}
.rating-row{display:flex;align-items:center;gap:12px;}
.rating-row input[type=range]{flex:1;accent-color:var(--hanko);}
.rating-out{
  width:38px;height:38px;border-radius:50%;border:2px solid var(--hanko);color:var(--hanko);
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex-shrink:0;
}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.modal small.hint{display:block;color:var(--ink-soft);font-size:11.5px;margin-top:4px;}

/* member modal list */
.attendee-checks{display:flex;flex-wrap:wrap;gap:8px;}
.attendee-chip{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;}
.attendee-chip input{accent-color:var(--hanko);}
.visit-attendees{padding:0 16px 10px;font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.visit-attendees .lbl{font-size:11px;color:var(--gold);letter-spacing:.08em;}
.visit-attendees button{background:none;border:none;color:var(--indigo);font-size:12px;cursor:pointer;padding:0;text-decoration:underline;}
.member-list{list-style:none;margin:0 0 14px;padding:0;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;}
.member-list li{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;}
.member-list li:last-child{border-bottom:none;}
.member-list button{background:none;border:none;color:var(--hanko);cursor:pointer;font-size:12px;}
.add-member-row{display:flex;gap:8px;}
.add-member-row input{flex:1;}

.loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:14px;}
@media (max-width:520px){
  .shop-header{flex-direction:column;}
  .shop-header img,.shop-header .ph-placeholder{width:100%;height:180px;}
}
</style>

<body>
<header class="noren">
  <div class="noren-inner">
    <div class="title-block">
      <h1>火曜ひらクリ会</h1>
      <p>行った店、飲んだ夜の記録</p>
    </div>
    <button class="member-pill" id="memberPillBtn">メンバー <span id="memberCount">0</span>/30人</button>
  </div>
</header>
<div class="wrap" id="root">
  <div class="loading">読み込み中…</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, getDocs, arrayUnion, arrayRemove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyADJgJtCupenKKCUzm7pkgSBvu0ZV9Wrbg",
  authDomain: "hirakuri-gogo-fire.firebaseapp.com",
  projectId: "hirakuri-gogo-fire",
  storageBucket: "hirakuri-gogo-fire.firebasestorage.app",
  messagingSenderId: "835278957837",
  appId: "1:835278957837:web:f5a7ee8ca021b88b995444",
  measurementId: "G-20EQXS9GHW"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

(function(){

var state = {
  view: 'list',
  currentShopId: null,
  shops: [],
  visitsCache: {},
  members: [],
  myName: '',
  loaded: false,
  searchQuery: '',
  sortMode: 'recent',
  filterParticipant: ''
};

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmtDate(d){
  if(!d) return '';
  var parts = d.split('-');
  if(parts.length!==3) return d;
  return parts[0]+'年'+parseInt(parts[1],10)+'月'+parseInt(parts[2],10)+'日';
}
function fmtDateShort(d){
  if(!d) return '';
  var parts = d.split('-');
  if(parts.length!==3) return d;
  return parts[0]+'/'+parseInt(parts[1],10)+'/'+parseInt(parts[2],10);
}
function todayStr(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,'0');
  var day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}
function showSaveError(){
  alert('保存に失敗しました。写真のサイズが大きすぎるか、通信が不安定な可能性があります。もう一度お試しください。');
}

/* ---------- personal (per-device) storage ---------- */
function getPersonal(key, fallback){
  try{
    var v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function setPersonal(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){ console.error(e); }
}

/* ---------- image compression ---------- */
function compressImage(file){
  return new Promise(function(resolve, reject){
    if(!file){ resolve(null); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 900;
        var w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.62));
      };
      img.onerror = function(){ reject(new Error('image load failed')); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   データ層（Firestore）
   ---------------------------------------------------------
   shops/{shopId}                              お店1件＝1ドキュメント
   shops/{shopId}/visits/{visitId}              記録（日付）1件＝1ドキュメント
   shops/{shopId}/visits/{visitId}/entries/{id} 感想1件＝1ドキュメント
   meta/members                                 メンバー一覧（配列操作は必ずarrayUnion/arrayRemove）
   ---------------------------------------------------------
   お店の新規作成・記録の新規作成・感想の追加は、それぞれ
   「新しいドキュメントを作る」だけなので、複数人が同時に
   行っても互いを上書きしません。
   ========================================================= */

async function loadAll(){
  try{
    var shopsSnap = await getDocs(collection(db, 'shops'));
    state.shops = shopsSnap.docs.map(function(d){
      var data = d.data();
      return { id: d.id, name: data.name || '', photo: data.photo || null, createdAt: data.createdAt || 0 };
    });
  }catch(e){ console.error(e); state.shops = []; }

  try{
    var memSnap = await getDoc(doc(db, 'meta', 'members'));
    state.members = memSnap.exists() ? (memSnap.data().list || []) : [];
  }catch(e){ console.error(e); state.members = []; }

  state.myName = getPersonal('my-name', '');

  await Promise.all(state.shops.map(function(s){ return loadVisits(s.id); }));
  state.loaded = true;
}

async function loadVisits(shopId){
  if(state.visitsCache[shopId]) return state.visitsCache[shopId];
  try{
    var visitsSnap = await getDocs(collection(db, 'shops', shopId, 'visits'));
    var visits = await Promise.all(visitsSnap.docs.map(async function(vDoc){
      var entriesSnap = await getDocs(collection(db, 'shops', shopId, 'visits', vDoc.id, 'entries'));
      var entries = entriesSnap.docs.map(function(eDoc){
        var d = eDoc.data();
        return { id: eDoc.id, author: d.author, rating: d.rating, comment: d.comment, photo: d.photo || null, createdAt: d.createdAt || 0 };
      });
      var vd = vDoc.data();
      return { id: vDoc.id, date: vd.date, topics: vd.topics || '', attendees: vd.attendees || [], entries: entries };
    }));
    state.visitsCache[shopId] = visits;
    return visits;
  }catch(e){
    console.error(e);
    state.visitsCache[shopId] = [];
    return [];
  }
}

/* ---- shop writes ---- */
async function createShop(shop){
  try{
    await setDoc(doc(db, 'shops', shop.id), { name: shop.name, photo: shop.photo, createdAt: shop.createdAt });
    return true;
  }catch(e){ console.error(e); showSaveError(); return false; }
}
async function updateShopFields(shopId, fields){
  try{ await updateDoc(doc(db, 'shops', shopId), fields); return true; }
  catch(e){ console.error(e); showSaveError(); return false; }
}
async function deleteShopEverything(shopId){
  try{
    var visits = state.visitsCache[shopId] || [];
    for(var i=0;i<visits.length;i++){
      var entries = visits[i].entries || [];
      for(var j=0;j<entries.length;j++){
        await deleteDoc(doc(db, 'shops', shopId, 'visits', visits[i].id, 'entries', entries[j].id));
      }
      await deleteDoc(doc(db, 'shops', shopId, 'visits', visits[i].id));
    }
    await deleteDoc(doc(db, 'shops', shopId));
    return true;
  }catch(e){ console.error(e); showSaveError(); return false; }
}

/* ---- visit / entry writes ---- */
async function createVisitWithEntry(shopId, visitFields, entryFields){
  try{
    var visitRef = doc(collection(db, 'shops', shopId, 'visits'));
    await setDoc(visitRef, visitFields);
    var entryRef = doc(collection(db, 'shops', shopId, 'visits', visitRef.id, 'entries'));
    await setDoc(entryRef, entryFields);
    return visitRef.id;
  }catch(e){ console.error(e); showSaveError(); return null; }
}
async function addEntryToVisit(shopId, visitId, entryFields){
  try{
    var entryRef = doc(collection(db, 'shops', shopId, 'visits', visitId, 'entries'));
    await setDoc(entryRef, entryFields);
    await updateDoc(doc(db, 'shops', shopId, 'visits', visitId), { attendees: arrayUnion(entryFields.author) });
    return true;
  }catch(e){ console.error(e); showSaveError(); return false; }
}
async function deleteEntryDoc(shopId, visitId, entryId){
  try{ await deleteDoc(doc(db, 'shops', shopId, 'visits', visitId, 'entries', entryId)); return true; }
  catch(e){ console.error(e); showSaveError(); return false; }
}
async function deleteVisitEverything(shopId, visitId){
  try{
    var visits = state.visitsCache[shopId] || [];
    var visit = visits.find(function(v){ return v.id === visitId; });
    var entries = visit ? (visit.entries||[]) : [];
    for(var i=0;i<entries.length;i++){
      await deleteDoc(doc(db, 'shops', shopId, 'visits', visitId, 'entries', entries[i].id));
    }
    await deleteDoc(doc(db, 'shops', shopId, 'visits', visitId));
    return true;
  }catch(e){ console.error(e); showSaveError(); return false; }
}
async function setVisitAttendees(shopId, visitId, attendees){
  try{ await updateDoc(doc(db, 'shops', shopId, 'visits', visitId), { attendees: attendees }); return true; }
  catch(e){ console.error(e); showSaveError(); return false; }
}

/* ---- members (always atomic array ops) ---- */
async function addMembersAtomic(names){
  names = names.filter(Boolean);
  if(!names.length) return true;
  try{
    await setDoc(doc(db, 'meta', 'members'), { list: arrayUnion.apply(null, names) }, { merge: true });
    return true;
  }catch(e){ console.error(e); showSaveError(); return false; }
}
async function removeMemberAtomic(name){
  try{ await updateDoc(doc(db, 'meta', 'members'), { list: arrayRemove(name) }); return true; }
  catch(e){ console.error(e); showSaveError(); return false; }
}

function shopAverage(shopId){
  var visits = state.visitsCache[shopId] || [];
  var total = 0, count = 0;
  visits.forEach(function(v){
    (v.entries||[]).forEach(function(e){ total += Number(e.rating)||0; count++; });
  });
  return count ? (total/count) : null;
}
function visitAverage(visit){
  var entries = visit.entries || [];
  if(!entries.length) return null;
  var total = 0;
  entries.forEach(function(e){ total += Number(e.rating)||0; });
  return total/entries.length;
}
function visitCount(shopId){
  return (state.visitsCache[shopId] || []).length;
}
function latestVisitDate(shopId){
  var visits = state.visitsCache[shopId] || [];
  var max = '';
  visits.forEach(function(v){ if((v.date||'') > max) max = v.date || ''; });
  return max;
}
function recentVisitDates(shopId, n){
  var visits = state.visitsCache[shopId] || [];
  var dates = visits.map(function(v){ return v.date; }).filter(Boolean);
  dates.sort(function(a,b){ return b.localeCompare(a); });
  return dates.slice(0, n);
}

function hankoHtml(avg, cls){
  cls = cls || '';
  if(avg === null || avg === undefined || isNaN(avg)){
    return '<div class="hanko empty '+cls+'"><span class="num">–</span><span class="lbl">未評価</span></div>';
  }
  return '<div class="hanko '+cls+'"><span class="num">'+avg.toFixed(1)+'</span><span class="lbl">評価</span></div>';
}

/* ---------- render ---------- */
var root = document.getElementById('root');

function render(){
  document.getElementById('memberCount').textContent = state.members.length;
  if(!state.loaded){
    root.innerHTML = '<div class="loading">読み込み中…</div>';
    return;
  }
  if(state.view === 'list'){
    renderList();
  } else {
    renderDetail();
  }
}

function renderList(){
  var html = '';
  html += '<div class="section-head"><h2>お店の記録</h2><button class="btn primary" id="addShopBtn">+ 新しいお店を追加</button></div>';

  html += '<div class="controls-bar">';
  html += '<input type="text" id="searchInput" placeholder="お店名で検索" value="'+esc(state.searchQuery)+'">';
  html += '<select id="sortSelect">';
  html += '<option value="recent"'+(state.sortMode==='recent'?' selected':'')+'>追加が新しい順</option>';
  html += '<option value="rating_desc"'+(state.sortMode==='rating_desc'?' selected':'')+'>評価が高い順</option>';
  html += '<option value="rating_asc"'+(state.sortMode==='rating_asc'?' selected':'')+'>評価が低い順</option>';
  html += '<option value="date_desc"'+(state.sortMode==='date_desc'?' selected':'')+'>最近行った順</option>';
  html += '<option value="date_asc"'+(state.sortMode==='date_asc'?' selected':'')+'>昔行った順</option>';
  html += '</select>';
  html += '<select id="participantFilter"><option value="">参加者で絞り込み（全員）</option>';

  });

  html += '</div>';

  var list = state.shops.slice();

    var q = state.searchQuery.toLowerCase();
    list = list.filter(function(s){ return s.name.toLowerCase().indexOf(q) !== -1; });
  }
  if(state.filterParticipant){
    list = list.filter(function(s){
      var visits = state.visitsCache[s.id] || [];
      return visits.some(function(v){ return (v.attendees||[]).indexOf(state.filterParticipant) !== -1; });
    });
  }
  switch(state.sortMode){
    case 'rating_desc':
      list.sort(function(a,b){ var av=shopAverage(a.id), bv=shopAverage(b.id); return (bv===null?-1:bv)-(av===null?-1:av); });
      break;
    case 'rating_asc':
      list.sort(function(a,b){ var av=shopAverage(a.id), bv=shopAverage(b.id); return (av===null?999:av)-(bv===null?999:bv); });
      break;
    case 'date_desc':
      list.sort(function(a,b){ return latestVisitDate(b.id).localeCompare(latestVisitDate(a.id)); });
      break;
    case 'date_asc':
      list.sort(function(a,b){ return latestVisitDate(a.id).localeCompare(latestVisitDate(b.id)); });
      break;
    default:
      list.sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  }

    html += '<div class="empty-state"><p>まだ記録がありません。最初の一軒を追加しましょう。</p><button class="btn primary" id="addShopBtnEmpty">+ 新しいお店を追加</button></div>';

      html += '<div class="shop-body">';
      html += '<p class="shop-name">'+esc(shop.name)+'</p>';
      html += '<p class="shop-meta">' + count + '回訪問</p>';
      var recentDates = recentVisitDates(shop.id, 3);
      if(recentDates.length){
        html += '<p class="shop-recent-dates">' + recentDates.map(fmtDateShort).join('　') + '</p>';
      }
      html += '</div>';
      html += hankoHtml(avg);
      html += '</div>';
    });
    html += '</div>';
  }
  root.innerHTML = html;

  document.getElementById('addShopBtn') && document.getElementById('addShopBtn').addEventListener('click', openAddShopModal);
  document.getElementById('addShopBtnEmpty') && document.getElementById('addShopBtnEmpty').addEventListener('click', openAddShopModal);
  document.querySelectorAll('.shop-card').forEach(function(card){
    card.addEventListener('click', function(){ openShop(card.getAttribute('data-shop')); });
  });
  document.getElementById('searchInput').addEventListener('input', function(e){ state.searchQuery = e.target.value; renderList(); });
  document.getElementById('sortSelect').addEventListener('change', function(e){ state.sortMode = e.target.value; renderList(); });
  document.getElementById('participantFilter').addEventListener('change', function(e){ state.filterParticipant = e.target.value; renderList(); });
}

      }

      html += '<div class="entries">';
      entries.forEach(function(entry){
        html += '<div class="entry">';

        html += '<div class="entry-body">';

        html += hankoHtml(Number(entry.rating), 'tiny');
        html += '<span class="entry-author">'+esc(entry.author)+'</span>';

        }
        html += '</div>';
        if(entry.comment) html += '<p class="entry-comment">'+esc(entry.comment)+'</p>';
        html += '</div></div>';
      });
      html += '</div>';

      html += '<button class="btn small" data-add-entry="'+visit.id+'">+ 自分の感想を追加</button>';
      if(isMine){
        html += '<button class="btn small danger" data-delete-visit="'+visit.id+'">この記録を削除</button>';

/* ---------- delete entry / visit ---------- */
async function deleteEntry(visitId, entryId){
  if(!confirm('この感想を削除しますか？この操作は取り消せません。')) return;
  var ok = await deleteEntryDoc(state.currentShopId, visitId, entryId);
  if(!ok) return;
  var visits = state.visitsCache[state.currentShopId] || [];
  var visit = visits.find(function(v){ return v.id === visitId; });
  if(visit) visit.entries = (visit.entries||[]).filter(function(e){ return e.id !== entryId; });
  render();
}
async function deleteVisit(visitId){
  if(!confirm('この日の記録を削除しますか？参加者・トピック・感想すべてが削除され、元に戻せません。')) return;
  var ok = await deleteVisitEverything(state.currentShopId, visitId);
  if(!ok) return;
  var visits = state.visitsCache[state.currentShopId] || [];
  state.visitsCache[state.currentShopId] = visits.filter(function(v){ return v.id !== visitId; });
  render();
}

/* ---------- modal helpers ---------- */
function closeModal(){
  var ov = document.querySelector('.overlay');
  if(ov) ov.remove();
}
function openModal(innerHtml){
  closeModal();
  var overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = '<div class="modal">'+innerHtml+'</div>';
  overlay.addEventListener('mousedown', function(e){ if(e.target === overlay) closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}

/* ---------- attendees sub-form ---------- */
function attendeesFieldHtml(selected){
  selected = selected || [];
  var html = '<div class="field"><label>参加者（実際に行ったメンバー・複数選択可）</label>';
  html += '<div class="attendee-checks" id="attendeeChecks">';
  if(state.members.length === 0){
    html += '<span style="font-size:12.5px;color:var(--ink-soft);">まだメンバーがいません。下に名前を入力してください。</span>';
  }
  state.members.forEach(function(m){
    var checked = selected.indexOf(m)!==-1 ? ' checked' : '';
    html += '<label class="attendee-chip"><input type="checkbox" value="'+esc(m)+'"'+checked+'> '+esc(m)+'</label>';
  });
  html += '</div>';
  html += '<input type="text" id="f-attendees-other" placeholder="その他の参加者（読点・カンマ区切りで複数可）" style="margin-top:8px;">';
  html += '<small class="hint">選んだ名前・入力した名前は自動でメンバーに登録されます。</small>';
  html += '</div>';
  return html;
}
function collectAttendees(){
  var checked = Array.prototype.map.call(document.querySelectorAll('#attendeeChecks input:checked'), function(cb){ return cb.value; });
  var otherEl = document.getElementById('f-attendees-other');
  var otherRaw = otherEl ? otherEl.value.trim() : '';
  var others = otherRaw ? otherRaw.split(/[,、]/).map(function(s){ return s.trim(); }).filter(Boolean) : [];
  var all = checked.concat(others);
  var seen = {};
  return all.filter(function(n){ if(seen[n]) return false; seen[n]=true; return true; });
}
async function ensureMembers(names){
  var toAdd = names.filter(function(n){ return n && state.members.indexOf(n) === -1; });
  if(!toAdd.length) return;
  if(state.members.length + toAdd.length > 30){
    var room = Math.max(0, 30 - state.members.length);
    toAdd = toAdd.slice(0, room);
    if(toAdd.length < names.length) alert('メンバーは最大30人までのため、一部の名前は登録されませんでした。');
  }
  if(!toAdd.length) return;
  var ok = await addMembersAtomic(toAdd);
  if(ok) toAdd.forEach(function(n){ state.members.push(n); });
}

function bindEntryFields(){
  var sel = document.getElementById('f-author-select');
  var newInput = document.getElementById('f-author-new');
  sel.addEventListener('change', function(){
    if(sel.value === '__new__'){
      newInput.style.display = 'block';
      newInput.focus();
    } else {
      newInput.style.display = 'none';
    }
  });
  var range = document.getElementById('f-rating');
  var out = document.getElementById('f-rating-out');
  range.addEventListener('input', function(){ out.textContent = range.value; });
  if(!state.myName){
    sel.value = '__new__';
    newInput.style.display = 'block';
  }

async function collectEntryFields(){
  var sel = document.getElementById('f-author-select');
  var newInput = document.getElementById('f-author-new');
  var author = sel.value === '__new__' ? newInput.value.trim() : sel.value;
  if(!author){ alert('お名前を選択するか入力してください。'); return null; }
  if(state.members.indexOf(author) === -1){
    if(state.members.length >= 30){
      alert('メンバーは最大30人までです。既存のメンバーから選んでください。');
      return null;
    }
    var ok = await addMembersAtomic([author]);
    if(ok) state.members.push(author);
  }
  state.myName = author;
  setPersonal('my-name', author);

  var rating = Number(document.getElementById('f-rating').value);
  var comment = document.getElementById('f-comment').value.trim();
  var photoFile = document.getElementById('f-entry-photo').files[0];
  var photo = null;
  try{ photo = await compressImage(photoFile); }catch(e){ /* ignore */ }
  return { author: author, rating: rating, comment: comment, photo: photo, createdAt: Date.now() };
}

    if(!entry) return;

    var photoFile = document.getElementById('f-photo').files[0];
    var btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '保存中…';

    var shopId = uid();

    state.currentShopId = shopId;
    await loadVisits(shopId); // Firestoreへ実際に保存された内容（本物のID付き）を取得
    render();
  });

    btn.disabled = true; btn.textContent = '保存中…';

    var fields = {};
    if(shop.name !== name) fields.name = name;
    if(shop.photo !== newPhoto) fields.photo = newPhoto;

      ok = await updateShopFields(shop.id, fields);

    if(!ok){ btn.disabled=false; btn.textContent='保存する'; return; }
    shop.name = name;
    shop.photo = newPhoto;
    closeModal();
    render();
  });

    btn.disabled = true; btn.textContent = '保存中…';
    var ok = await setVisitAttendees(state.currentShopId, visitId, attendees);
    if(!ok){ btn.disabled=false; btn.textContent='保存する'; return; }
    visit.attendees = attendees;
    closeModal();
    render();
  });
}

/* ---------- member management modal ---------- */
function openMemberModal(){
  var html = '';
  html += '<h3>メンバー管理（'+state.members.length+'/30人）</h3>';
  html += '<ul class="member-list" id="memberListUl">';
  if(state.members.length === 0){
    html += '<li style="color:var(--ink-soft);">まだメンバーがいません</li>';
  } else {
    state.members.forEach(function(m){
      html += '<li><span>'+esc(m)+'</span><button data-remove="'+esc(m)+'">削除</button></li>';
    });
  }
  html += '</ul>';
  html += '<div class="add-member-row"><input type="text" id="newMemberInput" placeholder="新しいメンバーの名前"><button class="btn small primary" id="addMemberBtn">追加</button></div>';
  html += '<small class="hint">記録に感想を書き込む際、ここに登録した名前から選べます。</small>';
  html += '<div class="modal-actions"><button class="btn ghost" id="closeMemberBtn">閉じる</button></div>';
  var overlay = openModal(html);
  document.getElementById('closeMemberBtn').addEventListener('click', function(){ closeModal(); render(); });
  overlay.querySelectorAll('[data-remove]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var name = btn.getAttribute('data-remove');
      if(!confirm(name + ' さんをメンバーから削除しますか？（過去の記録は残ります）')) return;
      var ok = await removeMemberAtomic(name);
      if(ok) state.members = state.members.filter(function(m){ return m !== name; });
      openMemberModal();
    });
  });
  document.getElementById('addMemberBtn').addEventListener('click', async function(){
    var input = document.getElementById('newMemberInput');
    var name = input.value.trim();
    if(!name) return;
    if(state.members.indexOf(name) !== -1){ alert('そのメンバーは既に登録されています。'); return; }
    if(state.members.length >= 30){ alert('メンバーは最大30人までです。'); return; }
    var ok = await addMembersAtomic([name]);
    if(ok) state.members.push(name);
    openMemberModal();
  });
}

document.getElementById('memberPillBtn').addEventListener('click', openMemberModal);

/* ---------- init ---------- */
loadAll().then(render);

})();
</script>
</body>
</html>
